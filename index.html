  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* A casca ocupa exatamente a altura da tela e cada tela rola por dentro.
       Antes a casca crescia com o conteúdo: no celular a janela inteira rolava
       e a barra de abas ficava depois do fim da lista. */
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: #f3f6fc; overscroll-behavior: none; }

    .stage {
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #f3f6fc;
    }

    .device {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      height: 100dvh;   /* acompanha a barra do navegador no iOS e no Android */
      background: #f3f6fc;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #root {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    /* Toast */
    .ccem-toast {
      position: fixed;
      bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: #1a2438;
      color: #fff;
      padding: 9px 15px;
      border-radius: 24px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      max-width: 90vw;
    }
    .ccem-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    /* Com ação, o toast aceita toque e pode quebrar linha */
    .ccem-toast.com-acao.show { pointer-events: auto; }
    .ccem-toast.com-acao { white-space: normal; text-align: left; line-height: 1.35; }
    .ccem-toast-acao {
      flex-shrink: 0; min-height: 44px; padding: 0 14px; margin-left: 4px;
      background: #4ade80; color: #0b2a14; border: none; border-radius: 22px;
      font: 600 12px 'DM Sans', system-ui, sans-serif; cursor: pointer;
    }

    /* Foco visível para quem navega por teclado */
    :focus-visible { outline: 3px solid #2d54c0; outline-offset: 2px; }

    /* O botão e o painel do Assistente nunca saem na impressão */
    @media print { .ccem-fab, .ccem-painel { display: none !important; } }

    /* Scrollbars */
    * { scrollbar-width: thin; scrollbar-color: #d5dff0 transparent; }
    *::-webkit-scrollbar { width: 3px; height: 3px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: #d5dff0; border-radius: 3px; }

    @keyframes ccem-bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-4px); }
    }

    /* Desktop */
    @media (min-width: 720px) {
      html, body { overflow: hidden; background: #f0f4fb; height: 100%; }
      .stage {
        height: 100vh;
        padding: 0;
        background: #f0f4fb;
        align-items: stretch;
        justify-content: stretch;
      }
      .device {
        width: 100%;
        max-width: 100%;
        height: 100vh;
        border-radius: 0;
        box-shadow: none;
        border: none;
      }
      .ccem-toast { bottom: 24px; }
    }
  </style>

  <!-- React 18.3.1, build de producao, hospedado localmente.
       Babel standalone (~3 MB) foi removido: o JSX e pre-compilado por build.sh -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
</head>

<!-- Service worker: shell e grade em cache, para abrir sem rede -->
<script>
  // Versão nova fica esperando; o app avisa e só troca quando o congressista toca.
  if ('serviceWorker' in navigator) {
    var ccemTinhaControle = !!navigator.serviceWorker.controller, ccemRecarregou = false;
    window.ccemAplicarAtualizacao = function () {
      if (window.__ccemNovaVersao) window.__ccemNovaVersao.postMessage('aplicar'); else location.reload();
    };
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!ccemTinhaControle) { ccemTinhaControle = true; return; }   // primeira instalação: nada a recarregar
      if (ccemRecarregou) return;
      ccemRecarregou = true;
      location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        function avisar(sw) { window.__ccemNovaVersao = sw; window.dispatchEvent(new Event('ccem:nova-versao')); }
        if (reg.waiting && navigator.serviceWorker.controller) avisar(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var nova = reg.installing;
          if (!nova) return;
          nova.addEventListener('statechange', function () {
            if (nova.state === 'installed' && navigator.serviceWorker.controller) avisar(nova);
          });
        });
        setInterval(function () { reg.update().catch(function () {}); }, 30 * 60 * 1000);
      }).catch(function () {});
    });
  }
</script>
